# PROJECT ROOT should be set by some kind of luncher

roots:
    main: "/home/kemot/Documents/Dev/_TestProjectRoot/<project_name>"

tokens:
    version: 
        type: int
        format: "v%03d"
    name:
        type: str
    step:
        type: str
    project_name:
        type: str

templates:
    # ASSETS TEMPLATES:
    asset_publish:
        template: "/assets/<name>_<step>_<version>"
        root: "main"