{% extends "base.html" %}
{% block title %}{{ 'Edit' if asset else 'Add' }} asset – Studio Asset DB{% endblock %}
{% block content %}
<h2>{{ 'Edit asset #%d' % asset.id if asset else 'Add new asset' }}</h2>

<form method="post" enctype="multipart/form-data"
      style="max-width: 640px; display: grid; gap: 14px;">

  <div>
    <label for="name">Name *</label>
    <input id="name" name="name" required style="width: 100%"
           value="{{ asset.name if asset else '' }}">
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
    <div>
      <label for="author">Author</label>
      <input id="author" name="author" style="width: 100%"
             value="{{ asset.author if asset else '' }}">
    </div>
    <div>
      <label for="version">Version</label>
      <input id="version" name="version" style="width: 100%"
             value="{{ asset.version if asset else 'v001' }}">
    </div>
    <div>
      <label for="status">Status</label>
      <select id="status" name="status" style="width: 100%">
        {% for status in statuses %}
          <option value="{{ status }}"
            {% if (asset and asset.status == status) or (not asset and status == 'wip') %}selected{% endif %}>
            {{ status }}
          </option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div>
    <label for="preview_img">Preview image</label>
    {% if asset and asset.preview_img %}
      <img class="thumb" src="{{ asset.preview_img }}" alt="current preview"><br>
    {% endif %}
    <input id="preview_img" name="preview_img" type="file" accept="image/*">
  </div>

  <div>
    <label>Steps (key → integer value, each with its own status)</label>
    <div id="steps"></div>
    <button class="btn" type="button" onclick="addStepRow()">+ add step</button>
    <input type="hidden" name="existing_step_keys"
           value="{{ asset.steps.keys() | join(',') if asset else '' }}">
  </div>

  <div>
    <label for="modified_by">Your user name (stored on modified steps)</label>
    <input id="modified_by" name="modified_by" style="width: 100%"
           value="{{ asset.author if asset else '' }}">
  </div>

  <div style="display: flex; gap: 10px;">
    <button class="btn primary" type="submit">{{ 'Save changes' if asset else 'Create asset' }}</button>
    <a class="btn" href="{{ url_for('index') }}">Cancel</a>
  </div>
</form>

<script>
  const STATUSES = {{ statuses | list | tojson }};
  const EXISTING_STEPS = {{ (asset.steps_detail if asset else {}) | tojson }};

  function addStepRow(key, value, status) {
    const row = document.createElement("div");
    row.style.cssText = "display:flex; gap:8px; margin-bottom:8px;";
    row.innerHTML = `
      <input name="step_key" placeholder="step (e.g. model)" value="${key || ""}" style="flex:2">
      <input name="step_value" type="number" placeholder="version" value="${value ?? ""}" style="flex:1" required>
      <select name="step_status" style="flex:1">
        ${STATUSES.map(s => `<option value="${s}" ${s === (status || "wip") ? "selected" : ""}>${s}</option>`).join("")}
      </select>
      <button class="btn danger" type="button" onclick="this.parentElement.remove()">✕</button>`;
    document.getElementById("steps").appendChild(row);
  }

  for (const [key, detail] of Object.entries(EXISTING_STEPS)) {
    addStepRow(key, detail.value, detail.status);
  }
</script>
{% endblock %}
